<div class="add-video-card">
  <div class="card-title">Add Video</div>
  
    <form class="card-body" [formGroup]="addVideoForm">
      <div class="input-row">
        <input 
          type="text" 
          name="name" 
          class="form-input" 
          formControlName="title"
          placeholder="Video Name *" 
        />
        <input 
          type="url" 
          name="url" 
          class="form-input" 
          formControlName="youtubeId"
          placeholder="Video URL *" 
        />
      </div>

      <div class="textarea-wrapper">
        <textarea 
          name="description" 
          id="text" 
          class="form-textarea" 
          formControlName="description"
          placeholder="Video Description"
        ></textarea>
      </div>

      <div class="button-wrapper">
        <button (click)="onSubmitAddVideo()" type="button" class="submit-btn">Submit</button>
      </div>
    </form>
</div>
